[package]
name = "homectl-server"
homepage = "https://github.com/FruitieX/homectl-server"
license = "MIT"
description = "A simple home automation server written in Rust"
version = "1.0.0"
authors = ["Rasmus Lövegren <fruitiex@gmail.com>"]
edition = "2021"
default-run = "homectl-server"

[lib]
name = "homectl_server"
path = "src/lib.rs"

[[bin]]
name = "homectl-server"
path = "src/main.rs"

[[bin]]
name = "script-worker"
path = "src/bin/script-worker.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
byteorder = "=1.5.0"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", features = ["serde"] }
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
palette = { version = "=0.7.7", features = ["serializing"] }
async-trait = "=0.1.92"
rand = "=0.10.3"
warp = "=0.3.7"
serde_path_to_error = "=0.1.20"
tokio = { version = "=1.53.1", features = ["full"] }
futures-util = "=0.3.34"
tokio-stream = "=0.1.19"
itertools = "=0.15.0"
sqlx = { version = "=0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
] }
sea-orm = { version = "=2.0.3", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
  "macros",
  "with-chrono",
  "with-json",
] }
sea-orm-migration = { version = "=2.0.3", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "sqlx-sqlite",
] }
once_cell = "=1.21.4"
rumqttc = { version = "=0.25.1", default-features = false }
toml = "=1.1.6"
ts-rs = { version = "=12.0.1", features = [
  "ordered-float-impl",
  "no-serde-warnings",
  "serde-json-impl",
] }
macro-attr = "=0.2.0"
newtype_derive = "=0.1.6"
log = "=0.4.34"
env_logger = "=0.11.11"
eyre = "=0.6.14"
color-eyre = "=0.6.5"
croner = "=4.0.0"
ordered-float = { version = "=5.5.0", features = ["serde"] }
jsonptr = "=0.8.2"
serde-this-or-that = "=0.5.0"
clap = { version = "=4.6.7", features = ["derive", "env"] }
boa_engine = "=0.22.0"
percent-encoding = "=2.3.2"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
ical = { version = "=0.11.0", features = ["ical"] }
csv = "=1.4.0"
cached = { version = "=4.0.0", features = ["async"] }
arc-swap = "=1.9.2"
console-subscriber = { version = "=0.5.0", optional = true }
chrono-tz = "=0.10.4"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[features]
default = []
# Enable `tokio-console` instrumentation. Build with
# `cargo run --features tokio-console` and connect with
# `tokio-console http://127.0.0.1:6669`.
tokio-console = ["dep:console-subscriber"]

[dev-dependencies]
datatest-stable = "=0.3.3"
tokio = { version = "=1.53.1", features = ["test-util"] }
reqwest = { version = "=0.13.5", features = ["blocking", "json"] }
testcontainers = { version = "=0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
which = "=8.0.6"

[[test]]
name = "integration"
harness = false
