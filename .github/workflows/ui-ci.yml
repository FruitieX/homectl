name: UI CI

# Called from server-ci.yml, whose publish job waits for these checks because
# they gate the unified image. Runs on its own only via workflow_dispatch.
on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  conventional-commit:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2

  build-ui:
    name: UI checks & browser smoke
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.17.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm tsc --pretty false

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Browser smoke (desktop and phone)
        run: pnpm test:browser
        env:
          SMOKE_SKIP_BUILD: '1'

      - name: Browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-browser-smoke
          path: ui/test-artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
