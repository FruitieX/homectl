[package]
name = "homectl-cli"
version = "0.1.0"
edition = "2021"
description = "CLI utility for interacting with the homectl server API"

[[bin]]
name = "homectl"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
colored = "3"
tabled = "0.22"
