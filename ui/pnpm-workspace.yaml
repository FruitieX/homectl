# pnpm 11 no longer reads the "pnpm" field of package.json, so shared settings
# live here. Both pnpm 10 (the flake and CI) and pnpm 11 honour this file.
overrides:
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # patched releases for open advisories (monaco-editor -> dompurify, colorthief -> sharp)
  dompurify: 3.4.13
  sharp: 0.35.4

# canvas and sharp are optional native extras; the app and its tests run without
# their build scripts (this states it explicitly instead of prompting).
allowBuilds:
  canvas: false
  sharp: false
