<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/homectl-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>homectl</title>
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('homectl-theme');
          const theme = stored ? JSON.parse(stored) : 'auto';
          let effectiveTheme = theme;
          if (theme === 'auto') {
            effectiveTheme = window.matchMedia('(prefers-color-scheme: dark)')
              .matches
              ? 'dark'
              : 'light';
          }
          document.documentElement.classList.toggle(
            'dark',
            effectiveTheme === 'dark',
          );
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body class="flex flex-col overflow-hidden">
    <div id="root" class="flex min-h-dvh flex-1 flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
